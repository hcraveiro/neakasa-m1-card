name: Publish Neakasa M1 Cards v1.3.0 stable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check card syntax
        run: node --check neakasa-m1-card.js
      - name: Run compatibility tests
        run: node --test tests/*.test.cjs
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable v1.3.0 release already exists; skipping."
            exit 0
          fi
          gh release create v1.3.0 neakasa-m1-card.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Neakasa M1 Cards v1.3.0" \
            --notes-file .github/RELEASE_NOTES_v1.3.0.md
