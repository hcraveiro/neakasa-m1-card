# Example package for Neakasa M1 v1.1.0 cards
# IMPORTANT: This example is tailored to cats named Cleo, Neffy and Penny.
# Adapt entity IDs, names and automation rules to your own integration.
# Requires Home Assistant Recorder (do not exclude input_text.neakasa_last_event).
# The Neakasa M1 card works without this package.
# Recent Activity requires its event producer and the input_text.neakasa_last_event history.
# Our Cats only needs this package for calculated daily stay duration.
# Install as /config/packages/neakasa_log.yaml if packages are enabled.
# Do not install this twice if you already have equivalent helpers/automations.

input_text:
  neakasa_last_event:
    name: Neakasa Last Event
    max: 255
  neakasa_cleaning_start:
    name: Neakasa Cleaning Start
    max: 80
  neakasa_visit_start:
    name: Neakasa Visit Start
    max: 80
  neakasa_pending_visits:
    name: Neakasa Pending Visits
    max: 255

input_number:
  neakasa_leveling_daily_count:
    name: Neakasa Leveling Daily Count
    min: 0
    max: 999
    step: 1
    mode: box
  neakasa_cleo_stay_today_s:
    name: Neakasa Cleo Stay Today (seconds)
    min: 0
    max: 86400
    step: 1
    mode: box
    unit_of_measurement: s
  neakasa_neffy_stay_today_s:
    name: Neakasa Neffy Stay Today (seconds)
    min: 0
    max: 86400
    step: 1
    mode: box
    unit_of_measurement: s
  neakasa_penny_stay_today_s:
    name: Neakasa Penny Stay Today (seconds)
    min: 0
    max: 86400
    step: 1
    mode: box
    unit_of_measurement: s

template:
  - sensor:
      - name: Neakasa Cleo Stay Today
        unique_id: neakasa_cleo_stay_today
        icon: mdi:clock-outline
        state: >-
          {% set s = states('input_number.neakasa_cleo_stay_today_s') | int(0) %}
          {{ (s // 3600) ~ 'h' if s >= 3600 else '' }}{{ ((s % 3600) // 60) ~ 'm' if s >= 60 else '' }}{{ (s % 60) ~ 's' }}
      - name: Neakasa Neffy Stay Today
        unique_id: neakasa_neffy_stay_today
        icon: mdi:clock-outline
        state: >-
          {% set s = states('input_number.neakasa_neffy_stay_today_s') | int(0) %}
          {{ (s // 3600) ~ 'h' if s >= 3600 else '' }}{{ ((s % 3600) // 60) ~ 'm' if s >= 60 else '' }}{{ (s % 60) ~ 's' }}
      - name: Neakasa Penny Stay Today
        unique_id: neakasa_penny_stay_today
        icon: mdi:clock-outline
        state: >-
          {% set s = states('input_number.neakasa_penny_stay_today_s') | int(0) %}
          {{ (s // 3600) ~ 'h' if s >= 3600 else '' }}{{ ((s % 3600) // 60) ~ 'm' if s >= 60 else '' }}{{ (s % 60) ~ 's' }}

automation:
  - id: neakasa_reset_leveling_counter
    alias: Neakasa - Reset Leveling Counter Daily
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.neakasa_leveling_daily_count
            - input_number.neakasa_cleo_stay_today_s
            - input_number.neakasa_neffy_stay_today_s
            - input_number.neakasa_penny_stay_today_s
        data:
          value: 0

  - id: neakasa_log_cat_visit
    alias: Neakasa - Log Cat Visit
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
          - sensor.cleo_last_visit
          - sensor.neffy_last_visit
          - sensor.penny_last_visit
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and as_timestamp(trigger.from_state.state, 0) > 0
             and as_timestamp(trigger.to_state.state, 0) > as_timestamp(trigger.from_state.state, 0)
             and 0 <= as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0) <= 900 }}
    actions:
      - variables:
          cat_id: "{{ trigger.entity_id.split('.')[1].split('_')[0] }}"
          visit_epoch: "{{ as_timestamp(trigger.to_state.state) | int }}"
          visit_time: "{{ as_local(as_datetime(trigger.to_state.state)).strftime('%H:%M') }}"
          queue: >-
            {% set raw = states('input_text.neakasa_pending_visits') %}
            {{ (raw | from_json) if raw.startswith('[') else [] }}
      - variables:
          matches: >-
            {{ queue | selectattr('s', 'ge', visit_epoch | int - 150)
                     | selectattr('s', 'le', visit_epoch | int + 150) | list }}
      - variables:
          match: >-
            {% set ns = namespace(item=none, gap=100000) %}
            {% for item in matches %}
              {% set gap = (item.s - (visit_epoch | int)) | abs %}
              {% if gap < ns.gap %}
                {% set ns.item = item %}
                {% set ns.gap = gap %}
              {% endif %}
            {% endfor %}
            {{ ns.item if ns.item is not none else none }}
          weight_entity: "{{ 'sensor.' ~ cat_id ~ '_weight' }}"
      - variables:
          found: "{{ match is not none }}"
          duration_sec: "{{ (match.d | int) if match is not none else 0 }}"
          weight: "{{ states(weight_entity) }}"
      - variables:
          message: >-
            {{ cat_id | title }} visited at {{ visit_time }}{% if found %}, stayed for {{ (duration_sec | int) // 60 }}m{{ (duration_sec | int) % 60 }}s{% endif %}{% if is_number(weight) %}, weighing {{ weight }}kg{% endif %}.
      - action: input_text.set_value
        target:
          entity_id: input_text.neakasa_last_event
        data:
          value: "{{ message }}"
      - if:
          - condition: template
            value_template: "{{ found and (duration_sec | int(0)) > 0 and cat_id in ['cleo', 'neffy', 'penny'] }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: "{{ 'input_number.neakasa_' ~ cat_id ~ '_stay_today_s' }}"
            data:
              value: "{{ [states('input_number.neakasa_' ~ cat_id ~ '_stay_today_s') | int(0) + duration_sec | int(0), 86400] | min }}"
      - if:
          - condition: template
            value_template: "{{ found }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.neakasa_pending_visits
            data:
              value: >-
                {% set chosen = match %}
                {% set ns = namespace(removed=false, remaining=[]) %}
                {% for item in queue %}
                  {% if not ns.removed and item.s == chosen.s and item.d == chosen.d %}
                    {% set ns.removed = true %}
                  {% else %}
                    {% set ns.remaining = ns.remaining + [item] %}
                  {% endif %}
                {% endfor %}
                {{ ns.remaining | to_json }}

  - id: neakasa_log_cleaning_leveling
    alias: Neakasa - Log Cleaning & Leveling
    mode: queued
    max: 30
    triggers:
      - trigger: state
        entity_id: sensor.neakasa_m1_status
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - variables:
          old_state: "{{ trigger.from_state.state }}"
          new_state: "{{ trigger.to_state.state }}"
          transition_epoch: "{{ as_timestamp(trigger.to_state.last_changed) | int }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ new_state == 'cat_appears' and old_state != 'cat_appears' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.neakasa_visit_start
                data:
                  value: "{{ transition_epoch }}"
          - conditions:
              - condition: template
                value_template: "{{ old_state == 'cat_appears' and new_state != 'cat_appears' }}"
            sequence:
              - variables:
                  start_epoch: "{{ states('input_text.neakasa_visit_start') | int(0) }}"
              - if:
                  - condition: template
                    value_template: "{{ start_epoch | int > 0 and 3 <= transition_epoch | int - start_epoch | int <= 1800 }}"
                then:
                  - variables:
                      queue: >-
                        {% set raw = states('input_text.neakasa_pending_visits') %}
                        {{ (raw | from_json) if raw.startswith('[') else [] }}
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.neakasa_pending_visits
                    data:
                      value: >-
                        {% set now_epoch = transition_epoch | int %}
                        {% set ns = namespace(items=[]) %}
                        {% for item in queue %}
                          {% if now_epoch - item.s < 7200 %}
                            {% set ns.items = ns.items + [item] %}
                          {% endif %}
                        {% endfor %}
                        {{ (ns.items + [{'s': start_epoch | int, 'd': now_epoch - start_epoch | int}])[-8:] | to_json }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.neakasa_visit_start
                data:
                  value: none
          - conditions:
              - condition: template
                value_template: "{{ old_state == 'leveling' and new_state == 'idle' }}"
            sequence:
              - action: input_number.increment
                target:
                  entity_id: input_number.neakasa_leveling_daily_count
              - action: input_text.set_value
                target:
                  entity_id: input_text.neakasa_last_event
                data:
                  value: "Manual leveling completed ({{ states('input_number.neakasa_leveling_daily_count') | int(0) }})"
          - conditions:
              - condition: template
                value_template: "{{ new_state == 'cleaning' }}"
            sequence:
              - variables:
                  previous: "{{ as_timestamp(states('input_text.neakasa_cleaning_start'), 0) | int }}"
              - if:
                  - condition: template
                    value_template: "{{ previous | int == 0 or transition_epoch | int - previous | int > 1800 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.neakasa_cleaning_start
                    data:
                      value: "{{ as_datetime(trigger.to_state.last_changed).isoformat() }}"
          - conditions:
              - condition: template
                value_template: "{{ new_state == 'idle' and old_state in ['cleaning', 'restoring'] }}"
            sequence:
              - delay: "00:00:05"
              - condition: state
                entity_id: sensor.neakasa_m1_status
                state: idle
              - variables:
                  start_epoch: "{{ as_timestamp(states('input_text.neakasa_cleaning_start'), 0) | int }}"
                  elapsed: "{{ transition_epoch | int - start_epoch | int }}"
              - if:
                  - condition: template
                    value_template: "{{ start_epoch | int > 0 and 5 <= elapsed | int <= 1800 }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.neakasa_last_event
                    data:
                      value: "Smart cleanup completed, took {{ elapsed }}s."
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.neakasa_cleaning_start
                    data:
                      value: none
